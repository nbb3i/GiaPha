services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: giapha
      POSTGRES_PASSWORD: giapha_password
      POSTGRES_DB: giapha
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giapha"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://giapha:giapha_password@db:5432/giapha?schema=public"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-doi-chuoi-bi-mat-nay}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-Admin@12345}"
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads

  # Chạy 1 lần để đồng bộ schema / seed dữ liệu.
  # Không tự chạy khi `docker compose up` (nhờ profile "tools").
  # Gọi qua: docker compose run --rm migrate <lệnh>
  migrate:
    build:
      context: .
      target: tooling
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://giapha:giapha_password@db:5432/giapha?schema=public"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-Admin@12345}"

volumes:
  pgdata:
  uploads:
